name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # the desktop app is built by desktop.yml; this job never starts Electron
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Parcha charge engine regression
        run: npx tsx server/lib/charges.check.ts
      - name: Transliteration check
        run: npx tsx server/lib/translit.check.ts
      - name: Number format check
        run: npx tsx src/lib/format.check.ts
      - name: Hinglish to Hindi check
        run: npx tsx src/lib/devanagari.check.ts
      - name: OCR retry behaviour
        run: npx tsx server/lib/gemini.check.ts
      - name: New permissions reach the right roles
        run: npx tsx server/lib/rbacSync.check.ts
      - name: End-to-end (isolated test database)
        run: npm run test:e2e
      - name: Build web bundle
        run: npm run build
