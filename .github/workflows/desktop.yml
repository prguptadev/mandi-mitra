# Builds the Windows installer (MandiMitra-Setup-x.y.z.exe) on a Windows
# machine, checks the packaged app starts and answers, and keeps the
# installer as a download on the run's page.
name: Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # to publish the Release on a version tag

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; }
      - run: npm ci
      - name: "The scanner script parses and runs on Windows (no scanner here, so an empty list)"
        shell: pwsh
        run: |
          npx tsx scripts/print-scanner-script.ts | Set-Content -Path scanner-wia.ps1 -Encoding utf8
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scanner-wia.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Host $_.Message }; throw "the scanner script does not parse" }
          $out = & powershell.exe -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File scanner-wia.ps1 -List 2>&1
          Write-Host "list: $out (exit $LASTEXITCODE)"
          if ($LASTEXITCODE -eq 0 -and "$out" -ne "[]") { throw "expected an empty scanner list, got: $out" }
          $diag = & powershell.exe -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File scanner-wia.ps1 -Diag 2>&1
          Write-Host "check: $diag (exit $LASTEXITCODE)"
          if ($LASTEXITCODE -ne 0) { throw "the scanner check did not run" }
          $j = "$diag" | ConvertFrom-Json
          if ($null -eq $j.windows) { throw "the scanner check said nothing about this computer" }
      - run: npm run build
      - run: npm run build:desktop-server
      # before electron-builder, which rebuilds better-sqlite3 for Electron
      - name: Books as the release before left them (for the update check below)
        run: npx tsx scripts/make-upgrade-fixture.ts upgrade-fixture
      - name: Build the installer
        run: npx electron-builder --win --publish never
      - name: The packaged app starts and answers
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/win-unpacked -Filter MandiMitra.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
      - name: The packaged app updates the release before's books
        shell: pwsh
        run: |
          $data = Join-Path $env:APPDATA "mandi-mitra\data"
          if (Test-Path $data) { Remove-Item -Recurse -Force $data }
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          Copy-Item upgrade-fixture\mandi.db (Join-Path $data "mandi.db")
          $exe = Get-ChildItem release/win-unpacked -Filter MandiMitra.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -PassThru -Wait -NoNewWindow -RedirectStandardOutput upgrade-out.txt -RedirectStandardError upgrade-err.txt
          $out = ((Get-Content upgrade-out.txt -Raw), (Get-Content upgrade-err.txt -Raw)) -join "`n"
          Write-Host $out
          if ($p.ExitCode -ne 0) { throw "the app did not start on last release's books (exit code $($p.ExitCode))" }
          if ($out -notmatch "backed up before update") { throw "no copy of the books was made before the update" }
          if ($out -notmatch "migrations up to date") { throw "the books were not updated" }
          if ($out -match "first run") { throw "new books were made instead of opening the old ones" }
          if (-not (Get-ChildItem (Join-Path $data "backups") -Filter "before-update-*.db")) { throw "no before-update backup file" }
      - uses: actions/upload-artifact@v4
        with:
          name: MandiMitra-Windows-installer
          path: release/*.exe
          if-no-files-found: error
      - name: Publish the Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/MandiMitra-Setup-*.exe \
            --title "Mandi Mitra ${GITHUB_REF_NAME}" \
            --notes "Windows installer. Download MandiMitra-Setup-*.exe, then in the app open Settings › App version and updates › Check for update. Your data is not touched by an update; a backup is taken first."
