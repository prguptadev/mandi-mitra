<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
<title>Mandi Mitra</title>
<style>
  /* Shown the moment the app is opened, until the main window is ready.
     Offline-safe: no web fonts, no outside files. */
  :root { --bg: #fbfaf7; --ink: #2a241f; --muted: #7a7068; --track: #e8e3da; --brand: #1a7a56; --brand2: #23996c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181b; --ink: #ece8e1; --muted: #9a938a; --track: #2a2d31; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "Segoe UI", "Nirmala UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    border: 1px solid rgba(0,0,0,.08); box-sizing: border-box; -webkit-app-region: drag; }
  .logo { width: 84px; height: 84px; animation: rise .6s ease-out both; filter: drop-shadow(0 6px 14px rgba(26,122,86,.28)); }
  h1 { margin: 2px 0 0; font-size: 24px; font-weight: 700; letter-spacing: .2px; animation: rise .6s .08s ease-out both; }
  .hi { margin: -8px 0 0; font-size: 15px; color: var(--muted); animation: rise .6s .12s ease-out both; }
  .bar { width: 220px; height: 4px; border-radius: 4px; background: var(--track); overflow: hidden; margin-top: 10px; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--brand), var(--brand2));
    animation: slide 1.1s ease-in-out infinite; }
  #status { font-size: 12.5px; color: var(--muted); min-height: 17px; text-align: center; padding: 0 20px; }
  #status.bad { color: #c0392b; font-size: 14px; font-weight: 600; }
  /* when start-up goes wrong: one sentence, Try again, Close, and where the log is */
  .btns { display: none; gap: 10px; -webkit-app-region: no-drag; }
  .btns button { font: inherit; font-size: 13.5px; padding: 7px 18px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--track); background: transparent; color: var(--ink); }
  .btns button.go { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  #log { display: none; font-size: 10.5px; color: var(--muted); max-width: 400px; text-align: center; padding: 0 16px;
    word-break: break-all; -webkit-user-select: text; user-select: text; -webkit-app-region: no-drag; }
  body.err .bar { display: none; }
  body.err .btns { display: flex; }
  body.err #log { display: block; }
  body.err .ver { display: none; }
  .ver { position: absolute; bottom: 10px; font-size: 11px; color: var(--muted); opacity: .8; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <svg class="logo" viewBox="0 0 1024 1024" aria-hidden="true">
    <defs>
      <linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23996c"/><stop offset="1" stop-color="#145c41"/></linearGradient>
    </defs>
    <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#t)"/>
    <g transform="translate(212 212) scale(25)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 22 16 8"/>
      <path d="M3.47 12.53 5 11l1.53 1.53a3.5 3.5 0 0 1 0 4.94L5 19l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z"/>
      <path d="M7.47 8.53 9 7l1.53 1.53a3.5 3.5 0 0 1 0 4.94L9 15l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z"/>
      <path d="M11.47 4.53 13 3l1.53 1.53a3.5 3.5 0 0 1 0 4.94L13 11l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z"/>
      <path d="M20 2h2v2a4 4 0 0 1-4 4h-2V6a4 4 0 0 1 4-4Z"/>
      <path d="M11.47 17.47 13 19l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L5 19l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z"/>
      <path d="M15.47 13.47 17 15l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L9 15l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z"/>
      <path d="M19.47 9.47 21 11l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L13 11l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z"/>
    </g>
  </svg>
  <h1>Mandi Mitra</h1>
  <p class="hi">मंडी मित्र</p>
  <div class="bar"><i></i></div>
  <div id="status">Starting…</div>
  <div class="btns"><button class="go" id="again">Try again</button><button id="close">Close</button></div>
  <div id="log"></div>
  <div class="ver" id="ver"></div>
  <script>
    // the app fills these in as it starts: setStatus("Opening your data…"), setVersion("0.2.1"),
    // and setError("Mandi Mitra could not open your books.", "C:\\…\\logs\\main.log") when it cannot
    window.setStatus = (text, bad) => { const s = document.getElementById("status"); s.textContent = text; s.className = bad ? "bad" : ""; };
    window.setError = (text, logFile) => {
      window.setStatus(text, true);
      document.getElementById("log").textContent = logFile ? "Details: " + logFile : "";
      document.body.classList.add("err");
    };
    // the two buttons reach the app through splash-preload.cjs, and nothing else does
    document.getElementById("again").onclick = () => window.mandi && window.mandi.tryAgain();
    document.getElementById("close").onclick = () => (window.mandi ? window.mandi.close() : window.close());
    window.setVersion = (v) => { document.getElementById("ver").textContent = "v" + v; };
    const q = new URLSearchParams(location.search);
    if (q.get("v")) window.setVersion(q.get("v"));
  </script>
</body>
</html>
