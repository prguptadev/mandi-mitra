<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>e-Mandi captcha viewer</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #fff; --ink: #1c1c1a; --muted: #5d5d57; --faint: #8a8a82;
    --line: #e2e2dc; --brand: #1f7a4d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --card: #202024; --ink: #ececea; --muted: #a9a9a2; --faint: #7c7c76;
      --line: #32323a; --brand: #4cc38a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171a; --card: #202024; --ink: #ececea; --muted: #a9a9a2; --faint: #7c7c76;
    --line: #32323a; --brand: #4cc38a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 56px; }
  h1 { font-size: 19px; margin: 0 0 16px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  textarea { width: 100%; min-height: 150px; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
             background: var(--bg); color: var(--ink); resize: vertical;
             font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  button { border: 1px solid var(--line); background: var(--card); color: var(--ink);
           border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button.go { background: var(--brand); border-color: var(--brand); color: #fff; }
  #shot { display: none; text-align: center; padding: 18px 14px; }
  #shot.on { display: block; }
  #img { max-width: 100%; height: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  #board { display: none; }
  #board.on { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  thead th { border-top: 0; color: var(--faint); font-size: 11px; text-transform: uppercase;
             letter-spacing: .04em; font-weight: 600; }
  tbody th { width: 34%; color: var(--muted); font-weight: 600;
             font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; }
  td { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  td.empty { color: var(--faint); font-style: italic; font-family: inherit; }
  a { color: var(--brand); }
</style>
</head>
<body>
<div class="wrap">
  <h1>e-Mandi captcha viewer</h1>

  <div class="card">
    <textarea id="in" spellcheck="false" autofocus
      placeholder="Paste the reply: the dntCaptcha div, a refresh reply, a JSON body, an image address, or a data:image URL"></textarea>
    <div class="row">
      <button class="go" id="show">Show</button>
      <button id="clear">Clear</button>
    </div>
  </div>

  <div class="card" id="shot"><img id="img" alt="captcha" /></div>

  <div class="card" id="board">
    <table>
      <thead><tr><th>Field</th><th>Value</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
  const BASE = "https://emandi.up.gov.in";
  const $ = (id) => document.getElementById(id);
  const un = (v) => String(v).replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&#39;/g, "'");

  /* Everything the paste carries, whatever shape it came in. */
  function read(text) {
    const t = text.trim();
    const fields = {};
    let picture = null;   // bytes we can draw
    let address = null;   // a path on e-Mandi, which only opens there

    if (!t) return { fields, picture, address };

    if (t.startsWith("data:image")) return { fields: { "image": "(the pasted data URL)" }, picture: t, address: null };
    if (/^https?:\/\//i.test(t) || t.startsWith("/")) {
      const url = t.startsWith("/") ? BASE + t : t;
      return { fields: { "image URL": url }, picture: null, address: url };
    }

    let obj = null;
    try { obj = JSON.parse(t); } catch { obj = null; }
    if (obj && typeof obj === "object") {
      const walk = (v, prefix) => {
        if (v === null || typeof v !== "object") {
          const s = v === null ? "" : String(v);
          fields[prefix] = s;
          if (s.startsWith("data:image")) picture = picture ?? s;
          else if (/DNTCaptchaImage|\.png|\.jpe?g/i.test(s)) address = address ?? (s.startsWith("/") ? BASE + s : s);
          return;
        }
        for (const [k, vv] of Object.entries(v)) walk(vv, prefix ? `${prefix}.${k}` : k);
      };
      walk(obj, "");
      // a reply can carry html in one of its values
      for (const v of Object.values(fields)) if (/<input|dntCaptcha/i.test(v)) Object.assign(fields, fromHtml(v).fields);
      const h = Object.values(fields).find((v) => /<input|dntCaptcha/i.test(v));
      if (h) { const inner = fromHtml(h); picture = picture ?? inner.picture; address = address ?? inner.address; }
      return { fields, picture, address };
    }

    return fromHtml(t);
  }

  /* The dntCaptcha block, as the page or the refresh sends it. */
  function fromHtml(t) {
    const fields = {};
    let picture = null, address = null;

    for (const m of t.matchAll(/<input\b[^>]*>/gi)) {
      const name = m[0].match(/\bname\s*=\s*"([^"]*)"/i) || m[0].match(/\bid\s*=\s*"([^"]*)"/i);
      if (!name) continue;
      const value = m[0].match(/\bvalue\s*=\s*"([^"]*)"/i);
      fields[name[1]] = value ? un(value[1]) : "";
    }
    const img = t.match(/<img\b[^>]*\bsrc\s*=\s*"([^"]+)"/i);
    const src = img ? un(img[1]) : (t.match(/\/DNTCaptchaImage\/Show\?[^"'\s<>]+/) || [])[0];
    if (src) {
      if (src.startsWith("data:image")) { picture = src; fields["image"] = "(inline in the paste)"; }
      else { address = src.startsWith("/") ? BASE + un(src) : un(src); fields["image URL"] = address; }
    }
    const refresh = t.match(/data-ajax-url\s*=\s*"([^"]+)"/i);
    if (refresh) fields["refresh URL"] = (un(refresh[1]).startsWith("/") ? BASE : "") + un(refresh[1]);
    const verify = t.match(/__RequestVerificationToken=([A-Za-z0-9_\-]+)/);
    if (verify) fields["__RequestVerificationToken"] = verify[1];
    const div = t.match(/<div\b[^>]*\bid\s*=\s*['"](dntCaptcha[A-Za-z0-9]*)['"]/i);
    if (div) fields["captcha div id"] = div[1];
    return { fields, picture, address };
  }

  const esc = (v) => String(v).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  function paint(got) {
    const rows = Object.entries(got.fields);
    $("rows").innerHTML = rows.map(([k, v]) => {
      const isUrl = /^https?:\/\//i.test(v);
      const cell = v === ""
        ? '<td class="empty">empty</td>'
        : isUrl ? `<td><a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a></td>`
        : `<td>${esc(v)}</td>`;
      return `<tr><th>${esc(k)}</th>${cell}</tr>`;
    }).join("");
    $("board").classList.toggle("on", rows.length > 0);

    $("shot").classList.remove("on");
    if (got.picture) {
      $("img").onload = () => $("shot").classList.add("on");
      $("img").onerror = () => $("shot").classList.remove("on");
      $("img").src = got.picture;
    } else {
      $("img").removeAttribute("src");
    }
  }

  $("show").onclick = () => paint(read($("in").value));
  $("clear").onclick = () => { $("in").value = ""; $("board").classList.remove("on"); $("shot").classList.remove("on"); };
  $("in").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("show").click(); });
</script>
</body>
</html>
